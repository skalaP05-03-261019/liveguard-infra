x-business-mcp: &business-mcp
  image: ${BUSINESS_MCP_IMAGE:?Set a verified immutable Business MCP image tag or digest}
  pull_policy: never
  build:
    context: ${AGENT_BUILD_CONTEXT:-../liveguard-agent}
    dockerfile: Dockerfile

  command: ["python", "-m", "app.business_mcp"]

  restart: unless-stopped
  stop_grace_period: 30s

  environment:
    BUSINESS_MCP_HOST: 0.0.0.0
    BUSINESS_MCP_PORT: "8002"
    BUSINESS_MCP_ALLOWED_HOSTS: "business-mcp:*,business-mcp-1:*,business-mcp-2:*,localhost:*,127.0.0.1:*"
    BUSINESS_BACKEND_BASE_URL: http://backend:8080
    BUSINESS_MCP_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    BUSINESS_MCP_AGENT_TOKEN: ${BUSINESS_MCP_AGENT_TOKEN:?Set BUSINESS_MCP_AGENT_TOKEN in .env}
    BUSINESS_MCP_MAX_REQUESTS: ${BUSINESS_MCP_MAX_REQUESTS:-16}
    BUSINESS_MCP_BACKEND_CONNECTIONS: ${BUSINESS_MCP_BACKEND_CONNECTIONS:-16}
    BUSINESS_MCP_BACKEND_TIMEOUT: ${BUSINESS_MCP_BACKEND_TIMEOUT:-10}
    BUSINESS_MCP_SHUTDOWN_TIMEOUT: ${BUSINESS_MCP_SHUTDOWN_TIMEOUT:-20}

  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3

  depends_on:
    backend:
      condition: service_started


services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - liveguard_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ${BACKEND_BUILD_CONTEXT:-../liveguard-be}
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      LIVEGUARD_POLICY_VERSION: ${LIVEGUARD_POLICY_VERSION:-}
      LIVEGUARD_TBD_FIXTURE_ENABLED: ${LIVEGUARD_TBD_FIXTURE_ENABLED:-false}
      AGENT_DELIVERY_ENABLED: ${AGENT_DELIVERY_ENABLED:-false}
      AGENT_DELIVERY_TRANSPORT: ${AGENT_DELIVERY_TRANSPORT:-db}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-liveguard}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      AGENT_BASE_URL: http://agent:8001
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}

    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: ${AGENT_BUILD_CONTEXT:-../liveguard-agent}
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      AGENT_GATEWAY_FACTORY: ${AGENT_GATEWAY_FACTORY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${LIVEGUARD_OPENAI_API_KEY:-}
      BUSINESS_MCP_URL: http://business-mcp:8002/mcp
      BUSINESS_MCP_CLIENT_CONCURRENCY: ${BUSINESS_MCP_CLIENT_CONCURRENCY:-8}
      BUSINESS_MCP_CALL_TIMEOUT: ${BUSINESS_MCP_CALL_TIMEOUT:-10}
      RAG_MCP_URL: http://rag-mcp:8003/mcp
      BUSINESS_MCP_AGENT_TOKEN: ${BUSINESS_MCP_AGENT_TOKEN:?Set BUSINESS_MCP_AGENT_TOKEN in .env}
      RAG_MCP_AGENT_TOKEN: ${RAG_MCP_AGENT_TOKEN:?Set RAG_MCP_AGENT_TOKEN in .env}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
      AGENT_TASK_DB_PATH: /var/lib/liveguard-agent/tasks.sqlite3
      AGENT_CHECKPOINT_DB_URL: ${AGENT_CHECKPOINT_DB_URL:?Set AGENT_CHECKPOINT_DB_URL in .env}

    volumes:
      - liveguard_agent_tasks:/var/lib/liveguard-agent

    ports:
      - "127.0.0.1:${AGENT_PORT:-8001}:8001"

    depends_on:
      backend:
        condition: service_started
      business-mcp:
        condition: service_started
      rag-mcp:
        condition: service_started

  business-mcp-1:
    <<: *business-mcp

  business-mcp-2:
    <<: *business-mcp

  business-mcp:
    image: ${HAPROXY_IMAGE:-haproxy:3.0.30-alpine@sha256:cf3af0facf7eb22b9fee463daf0fbc07ead740b8150696dce724264faf7b4318}
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./haproxy/business-mcp.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    # Neither upstream must be healthy for the proxy to start.
    depends_on:
      business-mcp-1:
        condition: service_started
      business-mcp-2:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8002/ready"]
      interval: 5s
      timeout: 3s
      retries: 3

  rag-mcp:
    build:
      context: ${AGENT_BUILD_CONTEXT:-../liveguard-agent}
      dockerfile: Dockerfile

    command: ["python", "-m", "app.rag_mcp"]

    restart: unless-stopped

    environment:
      RAG_MCP_HOST: 0.0.0.0
      RAG_MCP_PORT: "8003"
      RAG_MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,rag-mcp:*"
      RAG_DB_URL: ${RAG_DB_URL:-}
      OPENAI_API_KEY: ${LIVEGUARD_OPENAI_API_KEY:-}
      RAG_MCP_AGENT_TOKEN: ${RAG_MCP_AGENT_TOKEN:?Set RAG_MCP_AGENT_TOKEN in .env}
      EMBEDDING_MODEL: text-embedding-3-small
      LIVEGUARD_POLICY_VERSION: ${LIVEGUARD_POLICY_VERSION:-}


    depends_on:
      db:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-alpine
    profiles: ["rabbit"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-liveguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    volumes:
      - liveguard_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ${FRONTEND_BUILD_CONTEXT:-../liveguard-fe}
      args:
        VITE_USE_API: "true"
        VITE_USE_LIVE_V1: ${LIVEGUARD_V1_UI:-false}
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_started

volumes:
  liveguard_db:
  liveguard_agent_tasks:
  liveguard_rabbitmq:
