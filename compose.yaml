services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - liveguard_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../liveguard-be
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: ../liveguard-agent
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      BACKEND_BASE_URL: http://backend:8080
      BUSINESS_MCP_URL: http://business-mcp:8002/mcp
      RAG_MCP_URL: http://rag-mcp:8003/mcp
      BUSINESS_MCP_AGENT_TOKEN: ${BUSINESS_MCP_AGENT_TOKEN:?Set BUSINESS_MCP_AGENT_TOKEN in .env}
      RAG_MCP_AGENT_TOKEN: ${RAG_MCP_AGENT_TOKEN:?Set RAG_MCP_AGENT_TOKEN in .env}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
      AGENT_TASK_DB_PATH: /var/lib/liveguard-agent/tasks.sqlite3
      AGENT_CHECKPOINT_DB_URL: ${AGENT_CHECKPOINT_DB_URL:?Set AGENT_CHECKPOINT_DB_URL in .env}

    volumes:
      - liveguard_agent_tasks:/var/lib/liveguard-agent

    ports:
      - "127.0.0.1:8001:8001"

    depends_on:
      backend:
        condition: service_started
      business-mcp:
        condition: service_started
      rag-mcp:
        condition: service_started

  business-mcp:
    build:
      context: ../liveguard-agent
      dockerfile: Dockerfile

    command: ["python", "-m", "app.business_mcp"]

    restart: unless-stopped

    environment:
      BUSINESS_MCP_HOST: 0.0.0.0
      BUSINESS_MCP_PORT: "8002"
      BUSINESS_MCP_ALLOWED_HOSTS: "business-mcp:*,localhost:*,127.0.0.1:*"
      BUSINESS_BACKEND_BASE_URL: http://backend:8080
      BUSINESS_MCP_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      BUSINESS_MCP_AGENT_TOKEN: ${BUSINESS_MCP_AGENT_TOKEN:?Set BUSINESS_MCP_AGENT_TOKEN in .env}

    ports:
      - "127.0.0.1:8002:8002"

    depends_on:
      backend:
        condition: service_started

  rag-mcp:
    build:
      context: ../liveguard-agent
      dockerfile: Dockerfile

    command: ["python", "-m", "app.rag_mcp"]

    restart: unless-stopped

    environment:
      RAG_MCP_HOST: 0.0.0.0
      RAG_MCP_PORT: "8003"
      RAG_MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,rag-mcp:*"
      RAG_DB_URL: ${RAG_DB_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_MCP_AGENT_TOKEN: ${RAG_MCP_AGENT_TOKEN:?Set RAG_MCP_AGENT_TOKEN in .env}
      EMBEDDING_MODEL: text-embedding-3-small

    ports:
      - "127.0.0.1:8003:8003"

    depends_on:
      db:
        condition: service_healthy

volumes:
  liveguard_db:
  liveguard_agent_tasks:
